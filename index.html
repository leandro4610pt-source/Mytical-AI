<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mytical AI</title>

<style>
body{
margin:0;
font-family:system-ui, Arial;
background: radial-gradient(circle at top, #1a1a2e, #0f0f0f);
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR FUTURISTA */
#sidebar{
width:260px;
background: rgba(255,255,255,0.05);
backdrop-filter: blur(12px);
border-right: 1px solid rgba(255,255,255,0.08);
padding:12px;
display:flex;
flex-direction:column;
}

#newChat{
background: linear-gradient(135deg,#7c3aed,#22c55e);
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:600;
margin-bottom:10px;
box-shadow:0 0 15px rgba(124,58,237,0.4);
}

.chatItem{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
margin-bottom:6px;
border-radius:10px;
cursor:pointer;
background: rgba(255,255,255,0.06);
transition:0.2s;
}

.chatItem:hover{
background: rgba(255,255,255,0.12);
transform: scale(1.02);
}

.btns button{
background:none;
border:none;
cursor:pointer;
color:#aaa;
margin-left:5px;
font-size:14px;
}

.delBtn{color:#ff4d4d;}

/* CHAT AREA */
#main{
flex:1;
display:flex;
flex-direction:column;
}

#box{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

/* MENSAGENS */
.msg{
padding:12px 14px;
border-radius:14px;
max-width:70%;
word-wrap:break-word;
line-height:1.4;
animation: fadeIn 0.2s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.user{
background: linear-gradient(135deg,#2563eb,#1d4ed8);
align-self:flex-end;
box-shadow:0 0 12px rgba(37,99,235,0.4);
}

.bot{
background: rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
align-self:flex-start;
}

/* INPUT BAR */
.area{
display:flex;
padding:12px;
gap:10px;
background: rgba(255,255,255,0.04);
backdrop-filter: blur(10px);
border-top:1px solid rgba(255,255,255,0.08);
}

input{
flex:1;
padding:12px;
border:none;
border-radius:12px;
outline:none;
background: rgba(255,255,255,0.08);
color:white;
}

input::placeholder{
color:#aaa;
}

.send{
background: linear-gradient(135deg,#22c55e,#16a34a);
color:white;
border:none;
border-radius:12px;
padding:12px 16px;
cursor:pointer;
font-weight:600;
box-shadow:0 0 12px rgba(34,197,94,0.4);
}

/* SCROLLBAR */
#box::-webkit-scrollbar{
width:6px;
}

#box::-webkit-scrollbar-thumb{
background:#444;
border-radius:10px;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
<button id="newChat" onclick="startNewChat()">＋ Nova conversa</button>
<div id="chatList"></div>
</div>

<!-- CHAT -->
<div id="main">
<div id="box"></div>

<div class="area">
<input id="txt" placeholder="Escreve para a Mytical AI...">
<button class="send" onclick="send()">Enviar</button>
</div>
</div>

<script>

let chats = JSON.parse(localStorage.getItem("mytical_chats") || "{}");
let currentChat = null;

/* ---------------- CHAT ---------------- */

function startNewChat(){

let id="chat_"+Date.now();

chats[id]={
name:"Nova conversa",
messages:[]
};

currentChat=id;

save();
renderChats();
loadChat(id);

addBot("Nova conversa criada ✨");

}

function renderChats(){

let list=document.getElementById("chatList");
list.innerHTML="";

for(let id in chats){

let chat=chats[id];

let div=document.createElement("div");
div.className="chatItem";

let name=document.createElement("span");
name.textContent=chat.name;

let btns=document.createElement("div");
btns.className="btns";

let edit=document.createElement("button");
edit.innerHTML="✏️";
edit.onclick=(e)=>{
e.stopPropagation();
let n=prompt("Novo nome:",chat.name);
if(n){chat.name=n;save();renderChats();}
};

let del=document.createElement("button");
del.innerHTML="🗑";
del.className="delBtn";
del.onclick=(e)=>{
e.stopPropagation();
if(confirm("Apagar conversa?")){
delete chats[id];
save();
renderChats();
if(currentChat===id) clearBox();
}
};

btns.appendChild(edit);
btns.appendChild(del);

div.onclick=()=>loadChat(id);

div.appendChild(name);
div.appendChild(btns);

list.appendChild(div);

}

}

function loadChat(id){
currentChat=id;
clearBox();

chats[id].messages.forEach(m=>{
add(m.text,m.type,false);
});

}

/* ---------------- SAVE ---------------- */

function save(){
localStorage.setItem("mytical_chats",JSON.stringify(chats));
}

/* ---------------- UI ---------------- */

function clearBox(){
document.getElementById("box").innerHTML="";
}

function add(text,type,saveMsg=true){

let div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;

document.getElementById("box").appendChild(div);

document.getElementById("box").scrollTop=
document.getElementById("box").scrollHeight;

if(saveMsg && currentChat){
chats[currentChat].messages.push({text,type});
save();
}

}

function addUser(t){add(t,"user");}
function addBot(t){add("Mytical AI: "+t,"bot");}

/* ---------------- IA ---------------- */

function reply(text){

text=text.toLowerCase();

/* matemática */
let expr=text
.replace(/×/g,"*")
.replace(/x/g,"*")
.replace(/÷/g,"/")
.replace(/\^/g,"**");

try{
if(/^[0-9+\-*/().\s**]+$/.test(expr)){
return "Resultado: "+Function("return ("+expr+")")();
}
}catch{}

if(text.includes("ola")) return "Olá 👋";
if(text.includes("nome")) return "Sou a Mytical AI.";
if(text.includes("como estas")) return "Estou bem 😄";

return "Posso ajudar-te com contas e ideias de código.";
}

/* ---------------- SEND ---------------- */

function send(){

let input=document.getElementById("txt");
let t=input.value.trim();
if(!t)return;

addUser(t);

setTimeout(()=>{
addBot(reply(t));
},250);

input.value="";
}

/* INIT */
startNewChat();

</script>

</body>
</html>
